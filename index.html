function mkRoom(code,host){return new Promise((res,rej)=>{

  emit(e,d){const m={e,d};if(host)conns.forEach(c=>{try{c.open&&c.send(m)}catch(x){}});else if(up&&up.open){try{up.send(m)}catch(x){}}return Promise.resolve()},
  leave(){done=true;try{vStop(true)}catch(x){}try{peer.destroy()}catch(x){}}};

  if(host)peer.on('connection',c=>{c.on('open',()=>{conns.push(c);pc&&pc({joined:[c.peer]})});c.on('data',m=>fire(m.e,m.d));c.on('close',()=>{const k=conns.indexOf(c);if(k>=0)conns.splice(k,1);fire('drop',{peer:c.peer})})});
