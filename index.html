 S.seats=S.seats.filter(on);S.wl=(S.wl||[]).filter(on);while(S.seats.length<5&&S.wl.length)S.seats.push(S.wl.shift());
 S.dl=S.dl%Math.max(1,S.seats.length);S.bkm=S.bkm||{};S.bk=S.seats.map(x=>S.bkm[seatKey(x)]??(S.cc||100));S.bk0=null}

 if(S.turn==i){S.turn=nxt(i);S.ph='draw';S.pk=null}}

 S.seats.forEach((x,i)=>{if(S.ph!='end'&&x.c&&x.c!=cid&&!S.pkd[i]&&Date.now()-(seen[x.c]||S.t0||Date.now())>60000){packPlayer(i);ch=1}});if(ch)post()}

function lobbyHtml(){
 const P2=code=='P2P',seats=S.seats,N=seats.length,inGame=S.ph!='lobby',wl=S.wl||[],rd=S.rd||{};
 if((S.kk||[]).includes(cid))return `<div class="lb" style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3cqh"><div style="font-size:5cqh;color:#ffb3a8">${L('होस्टले तपाईंलाई कोठाबाट हटायो','The host removed you from the room')}</div><button class="lbtn pri" data-a="back">OK</button></div>`;

const fwm=S.fw||{},fwN=x=>fwHum().filter(y=>y.c!=x&&fwm[y.c]==x).length,fwB=s=>(P2||inGame||s.b||!s.c||s.c==cid||!seats.some(x=>x.c==cid))?'':`<button class="lx fw ${fwm[cid]==s.c?'on':''}" data-a="fw" data-v="${esc(s.c)}">${fwm[cid]==s.c?'✅':'👆'} ${L('फलो','Follow')}${fwN(s.c)?' '+fwN(s.c):''}</button>`;
 const card=(s,i)=>{const v=vfor(s),host0=i==hostIdx()&&!P2;
  const st=s.b?L('कम्प्युटर','Computer'):host0?L('होस्ट','Host'):inGame?L('खेलिरहेको','Playing'):(rd[s.c]?`<span style="color:#7ee0a3">✅ ${L('तयार','Ready')}</span>`:'⏳ '+L('पर्खँदै','Waiting'));

 let cards=seats.map(card).join('');
 for(let k=N;k<5;k++)cards+=isHost&&!inGame?`<button class="lp em" data-a="addb">＋ 🤖 ${L('कम्प्युटर','Computer')}</button>`:`<div class="lp em">${L('खाली सिट','Open seat')}</div>`;
 const rc=seats.filter((s,i)=>s.c&&i!=hostIdx()&&rd[s.c]).length,hc=seats.filter((s,i)=>s.c&&i!=hostIdx()).length;
 const led=S.bkm&&Object.keys(S.bkm).length?`<div class="sb">🏆 ${seats.map(s=>`${esc(s.n)} <b>🪙${S.bkm[seatKey(s)]??'–'}</b>`).join(' · ')}</div>`:'';
 const vbtn=P2?'':((isHost&&vlist.some(x=>x.cid!=cid)?`<button class="lbtn" data-vc="hmall" data-on="${vlist.some(x=>x.cid!=cid&&!x.hm)?1:0}">${vlist.some(x=>x.cid!=cid&&!x.hm)?'🔇':'🔊'} ${L('सबै','All')}</button>`:'')+(vs?`<button class="lbtn ${vm?'':'on'}" data-vc="mute">${vm?'🔇 '+L('माइक बन्द','Muted'):'🎤 '+L('बोल्दै','Live')}</button><button class="lbtn" data-vc="leave">✕ ${L('छोड्नुस्','Leave')}</button>`:`<button class="lbtn" data-vc="join">🎙 ${L('बोल्नुस्','Voice')}${vlist.length?' · '+vlist.length:''}</button>`));
 const head=`<div class="lh"><button class="lbtn" data-a="back" title="back">←</button><div><div class="rl">${P2?'📡 NEARBY':L('कोठा कोड','ROOM CODE')}</div>${P2?'':`<div class="rc">${esc(code)}</div>`}</div>${P2?`<button class="lbtn" data-a="nadd">➕ ${L('साथी जोड्नुस्','Add friend')}</button>`:`<button class="lbtn" data-a="copy">📋</button><button class="lbtn" data-a="share">📤 ${L('पठाउनुस्','Share')}</button>`}<div style="flex:1"></div><button class="lbtn" data-a="rules">🧩 ${L('नियम','Rules')}</button>${vbtn}</div>`;
 const banner=inGame?`<div class="wb">🎮 ${wl.some(x=>x.c==cid)?L('खेल चलिरहेको छ — सकिएपछि अर्को खेलमा तपाईं आफैं जोडिनुहुन्छ। तबसम्म यहीँ कुरा गर्नुस् 💬','A game is in progress — you will join the next one automatically. Chat here meanwhile 💬'):L('खेल चलिरहेको छ। सकिएपछि होस्टले Lobby खोल्छ।','A game is in progress. The host opens the lobby when it ends.')}</div>`:'';
 const wlh=wl.length?`<div class="sb">⏳ ${L('अर्को खेलमा','Next game')}: ${wl.map(x=>esc(x.n)).join(', ')}</div>`:'';
 const left=`<div class="lpn">${banner}<div class="lt">${L('खेलाडी','Players')} ${N}/5${isHost&&!inGame&&hc?` · ✅ ${rc}/${hc}`:''}</div><div class="lpl">${cards}</div>${wlh}${led}</div>`;
 const right=`<div class="lc"><div id="chl">${chHtml()}</div><div class="cq">${CHQ.map((t,i)=>`<button data-a="cq" data-v="${i}">${esc(t)}</button>`).join('')}</div><div class="ci"><input id="cti" maxlength="160" placeholder="${L('सन्देश लेख्नुस्…','Type a message…')}" autocomplete="off"><button class="lbtn pri" data-a="csend">➤</button></div></div>`;
 let foot='';
 if(!inGame){if(isHost)foot=`${ccCompact()}${S.bkm&&Object.keys(S.bkm).length?`<button class="lbtn" data-a="ns">🔄 ${L('नयाँ सिजन','New season')}</button>`:''}<div class="lbn">${N<2?L('कम्तीमा २ जना चाहिन्छ','Need at least 2 players'):hc&&rc<hc?L('सबै तयार भएनन्, तर सुरु गर्न सकिन्छ','Not everyone is ready — you can still start'):''}</div><button class="lbtn pri big" data-a="go" ${N<2?'disabled':''}>Start ▶</button>`;
  else foot=`${ccCompact()}<div class="lbn">${L('होस्टले सुरु गर्छ','The host will start the game')}</div><button class="lbtn pri big" data-a="rdy" ${seats.some(x=>x.c==cid)?'':'disabled'}>${rd[cid]?'✅ '+L('तयार','Ready'):'✋ '+L('म तयार छु','I am ready')}</button>`}
 return `<div class="lb">${head}${left}${right}<div class="lf">${foot}</div></div>`}

<script>
/* js/presence.js - online heartbeat, latency, green/red dots */
/* ---- Presence: guests send a heartbeat to the host; host tells everyone who is online (green/red dot on avatar) ---- */
let seenT=Date.now(),seen={},onl=new Set(),lastPr=0,lastPo=0,lats={},myLat=null,joining=0,wlk=null;
const isOn=c=>c==cid?(isHost||Date.now()-lastPo<9000):(isHost?Date.now()-(seen[c]||0)<9000:(Date.now()-lastPr<9000&&onl.has(c)));
const latOf=c=>c==cid?(isHost?0:myLat):lats[c];
const qOf=c=>{if(!isOn(c))return 'off';const l=latOf(c);return l==null||l<250?'good':l<600?'mid':'bad'};
const msOf=c=>{if(!isOn(c))return L('अफलाइन','offline');if(c==cid&&isHost)return L('होस्ट','host');const l=latOf(c);return l==null?'…':Math.round(l)+' ms'};
function odot(s,inl){return(mode=='online'&&s&&s.c&&!s.b)?`<span class="od ${inl?'in ':''}${isOn(s.c)?'on ':''}${qOf(s.c)}" data-oc="${esc(s.c)}"></span>${inl?`<i class="lat" data-om="${esc(s.c)}">${msOf(s.c)}</i>`:''}`:''}
function prUpdate(){document.querySelectorAll('[data-oc]').forEach(e=>{const c=e.dataset.oc;e.classList.toggle('on',isOn(c));const q=qOf(c);['good','mid','bad','off'].forEach(k=>e.classList.toggle(k,k==q))});document.querySelectorAll('[data-om]').forEach(e=>{const c=e.dataset.om,t=msOf(c);if(e.textContent!==t)e.textContent=t;const q=qOf(c);e.style.color=q=='off'?'#ff7a6b':q=='bad'?'#ff8a30':q=='mid'?'#f2c230':'#7ee0a3'});
 try{if(mode=='online'&&S&&S.seats&&isOn(cid)&&(V=='game'||V=='lobby'||V=='wait')){S.seats.forEach(x=>{if(!x.c||x.b||x.c==cid)return;const o=isOn(x.c),p=pst[x.c];if(p!=null&&p!==o)toast((o?'✅ ':'⚠ ')+x.n+(o?L(' फेरि अनलाइन भयो',' is back online'):L(' अफलाइन भयो — इन्टरनेट गयो',' went offline')));pst[x.c]=o})}}catch(e){}
 netChip()}
/* status chip sits just left of the mic/voice buttons (game: #vc, lobby: Rules + voice buttons) and is centred on their row */
function netPos(){try{const n=document.getElementById('net');if(!n)return;const bs=[...document.querySelectorAll('#vc>:first-child,.lh [data-a="rules"],.lh [data-vc]')].filter(e=>e.getClientRects().length);
 if(!bs.length){n.style.top=n.style.right=n.style.transform='';return}
 const rs=bs.map(e=>e.getBoundingClientRect()),l=Math.min(...rs.map(r=>r.left));
 n.style.right=Math.max(0,Math.ceil(innerWidth-l+innerHeight*.012))+'px';n.style.top=Math.round(rs[0].top+rs[0].height/2)+'px';n.style.transform='translateY(-50%)'}catch(e){}}
addEventListener('resize',()=>netPos());addEventListener('orientationchange',()=>setTimeout(netPos,300));
function netChip(){let el=document.getElementById('net');if(!el){el=document.createElement('div');el.id='net';document.body.appendChild(el)}
 const onl=mode=='online'&&room&&code!='P2P'&&(V=='lobby'||V=='wait'||V=='game');let q='',t='';
 if(!navigator.onLine&&(onl||joining)){q='off';t=L('इन्टरनेट छैन','No internet')}
 else if(joining){q='mid';t=L('कोठामा जोड्दै…','Joining room…')}
 else if(!onl){el.style.display='none';return}
 else{q=qOf(cid);const l=latOf(cid);
  if(q=='off')t=L('जडान टुटेको — पुनः जोड्दै…','Disconnected — reconnecting…');
  else{t=(q=='good'?L('जडान राम्रो','Connected'):q=='mid'?L('जडान ढिलो','Slow'):L('जडान कमजोर','Weak'))+(isHost?'':(l!=null?' · '+Math.round(l)+' ms':''));
   if(isHost&&S&&S.seats){const pl=S.seats.filter(x=>x.c&&!x.b),off=pl.filter(x=>!isOn(x.c));t+=' · '+(pl.length-off.length)+'/'+pl.length+' '+L('अनलाइन','online');if(off.length)q=q=='good'?'mid':q}}}
 if(mig.on&&onl&&navigator.onLine){q='mid';t=L('होस्ट अफलाइन — नयाँ होस्ट छान्दै…','Host offline — choosing a new host…')}
 const h=`<b class="nd ${q}"></b>${t}`;if(el._h!==h){el._h=h;el.innerHTML=h}el.className='net '+q;el.style.display='flex';netPos()}
function wakeLock(){try{if(mode=='online'&&navigator.wakeLock&&!wlk&&document.visibilityState=='visible'){wlk='p';navigator.wakeLock.request('screen').then(l=>{wlk=l;l.addEventListener('release',()=>{wlk=null})}).catch(()=>{wlk=null})}}catch(e){wlk=null}}
function prTick(){if(!room||mode!='online')return;try{if(isHost){if(!S||!S.seats)return;const on=S.seats.filter(x=>x.c&&(x.c==cid||Date.now()-(seen[x.c]||0)<9000)).map(x=>x.c);onl=new Set(on);lastPr=Date.now();room.emit('pr',{on,lat:lats});packCheck()}
 else{room.emit('hb',{cid,t:Date.now(),lat:myLat});if(room.reconnect&&Date.now()-lastPo>12000&&Date.now()-(room._rc||0)>6000){room._rc=Date.now();room.reconnect(true)}}
 try{if(!isHost&&S&&S.seats&&!S.seats.some(x=>x.c==cid)&&!(S.wl||[]).some(x=>x.c==cid)&&!(S.kk||[]).includes(cid)&&Date.now()-(prTick.rj||0)>4000){prTick.rj=Date.now();room.emit('join',{cid,n:nm})}
 if(isHost&&Date.now()-(prTick.ls||0)>6000){prTick.ls=Date.now();pushSt();if(vlist.length)room.emit('vl',vlist)}
 if(vs&&!vlist.some(x=>x.cid==cid)&&Date.now()-(prTick.va||0)>3000){prTick.va=Date.now();vAnnounce()}}catch(e){}
 wakeLock()}catch(e){}try{migTick();hostTick();fwCheck()}catch(e){}prUpdate()}
setInterval(prTick,2000);setInterval(prUpdate,1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible'){mig.okAt=Date.now();wakeLock();try{room&&room.reconnect&&room.reconnect(false)}catch(e){}prTick()}});
addEventListener('online',()=>{mig.okAt=Date.now();try{room&&room.reconnect&&room.reconnect(true)}catch(e){}netChip()});addEventListener('offline',netChip);
addEventListener('beforeunload',e=>{if(V=='game'&&S&&S.ph!='end'){e.preventDefault();e.returnValue=''}});
let xhtml='';function xbRender(){const el=$('#xb');if(!el)return;const h=(V=='game'&&S&&S.ph&&S.ph!='lobby'&&S.ph!='end')?`<button class="xbtn" data-a="home">⏻ ${L('बाहिर','Exit')}</button>${S.pkd&&S.pkd[me()]?`<span class="xcoin" style="border-color:#ff9a8f;color:#ff9a8f">${L('प्याक भयो','PACKED')}</span>`:''}${S.bk&&S.bk[me()]!=null?`<span class="xcoin">🪙 ${S.bk[me()]}</span>`:''}`:'';if(h!==xhtml){xhtml=h;el.innerHTML=h}}
</script>
<script>
/* js/voice.js - voice chat (WebRTC mesh) */
/* ---- Voice chat: mesh of PeerJS media calls. Who-is-in-voice list travels over the existing room channel (host relays). ---- */
let vs=null,vm=false,vcalls={},vlist=[],vlev={},vctx=null,vhtml='',vhf=false,vhm={};
const vme=()=>room&&room.peer&&room.peer.id;
const vOk=c=>!!(c&&c._got&&c.peerConnection&&/^(connected|completed)$/.test(c.peerConnection.iceConnectionState)),vIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform=='MacIntel'&&navigator.maxTouchPoints>1);
function vOnCall(c){if(!vs)return c.close();const o=vcalls[c.peer];if(o){delete vcalls[c.peer];try{o.close()}catch(e){}}c.answer(vs);vAttach(c)}
function vAttach(c){const id=c.peer;vcalls[id]=c;c.on('stream',st=>{c._got=1;vPlay(id,st);vcRender()});c.on('close',()=>vGone(id,c));c.on('error',()=>vGone(id,c))}
function vCall(id){let c=null;try{c=room.peer.call(id,vs)}catch(e){}if(!c)return;vAttach(c);setTimeout(()=>{if(vcalls[id]===c&&!vOk(c)){try{c.close()}catch(e){}vSync()}},15000)}
function vGone(id,c){if(vcalls[id]!==c)return;delete vcalls[id];delete vlev[id];const a=document.getElementById('va-'+id);if(a){a.srcObject=null;a.remove()}vcRender()}
function vPlay(id,st){let a=document.getElementById('va-'+id);if(!a){a=document.createElement('audio');a.id='va-'+id;a.autoplay=true;a.setAttribute('playsinline','');a.style.cssText='position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none';document.body.appendChild(a)}a.muted=false;a.volume=1;a.srcObject=st;const p=a.play();if(p&&p.catch)p.catch(()=>toast(L('🔈 आवाज सुन्न स्क्रिन एकपटक छुनुस्','🔈 Tap the screen once to hear voice')));vLevel(id,st)}
function vLevel(k,st){if(vIOS)return;try{vctx=vctx||new(window.AudioContext||window.webkitAudioContext)();if(vctx.resume)vctx.resume();const an=vctx.createAnalyser();an.fftSize=256;vctx.createMediaStreamSource(st).connect(an);vlev[k]={an,b:new Uint8Array(an.frequencyBinCount)}}catch(e){}}
function vSync(){if(vs&&room&&room.peer){Object.keys(vcalls).forEach(k=>{const c=vcalls[k],s=c.peerConnection&&c.peerConnection.iceConnectionState;if(s=='failed'||s=='closed'||(s=='disconnected'&&Date.now()-(c._d=c._d||Date.now())>6000)){try{c.close()}catch(e){}}else if(s!='disconnected')c._d=0});const me=vme();if(me)vlist.forEach(x=>{if(x.id!=me&&me<x.id&&!vcalls[x.id])vCall(x.id)})}vcRender()}
function vAnnounce(){const e={id:vme(),cid,m:vm?1:0};if(isHost){vlist=vlist.filter(x=>x.cid!=cid);vlist.push(e);room.emit('vl',vlist)}else room.emit('vj',e)}
async function vStart(){if(vs)return;if(!room||!room.peer)return toast(L('पहिले कोठामा जोडिनुस्','Join the room first'));
 if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return alert(L('माइक चलाउन गेम https:// लिङ्कबाट खोल्नुपर्छ। डाउनलोड गरेको फाइल (content:// वा file://) बाट माइक चल्दैन — गेमलाई GitHub Pages / Netlify जस्ता https वेबसाइटमा राखेर खोल्नुस्।','The microphone only works when the game is opened from an https:// link. It does not work from a downloaded file (content:// or file://) — host the game on an https site such as GitHub Pages or Netlify.'));
 let st;try{st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false})}catch(e){try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e2){return alert(e2&&e2.name=='NotFoundError'?L('माइक भेटिएन — फोनमा माइक चालु छ कि जाँच्नुहोस्।','No microphone found.'):L('Mic को अनुमति दिनुहोस् (Phone/Browser Settings → Site settings → Microphone)।','Please allow microphone access (Phone/Browser Settings → Site settings → Microphone).'))}}try{if(vctx&&vctx.resume)vctx.resume()}catch(e){}

const sKey=c=>cs(c)==4?-1:cs(c);
const sPlain=h=>h.slice().sort((a,b)=>sKey(a)-sKey(b)||cr(a)-cr(b));
function sGroup(h){const cnt={},jk=[],used={};h.forEach(c=>{if(cs(c)==4)jk.push(c);else cnt[c]=(cnt[c]||0)+1});
 const runs=[];
 for(let s=0;s<4;s++)for(;;){let best=null;
  for(let st=1;st<=12&&!best;st++){const tmp={};const run=[];
   for(let i=0;st+i<=14;i++){const r=st+i==14?1:st+i,k=s*16+r;tmp[k]=tmp[k]||0;if((cnt[k]||0)-tmp[k]>0){tmp[k]++;run.push(k)}else break}
   if(run.length>=3)best=run}
  if(!best)break;best.forEach(k=>{cnt[k]--;});runs.push(best)}
 const rest=[];Object.keys(cnt).forEach(k=>{for(let i=0;i<cnt[k];i++)rest.push(+k)});
 return jk.concat(...runs,sPlain(rest))}
function sortHand(o){const p=sPlain(o),g=sGroup(o),eq=(a,b)=>a.length==b.length&&a.every((x,i)=>x==b[i]);return eq(o,p)&&!eq(p,g)?g:p}
function sortRun(){let sk=0;if(!SF){/* a redraw (bots playing) must not cut a running sort animation: resume it from where it was */if(!SA||Date.now()-SA.t>SA.e){SA=null;return}SF=SA.o;sk=Date.now()-SA.t}const o=SF;SF=null;if(S&&S.fresh&&Date.now()-dealAt<2600)return;const u=new Set(),dur=Math.max(300,Math.min(750,520*CFG().speed));if(!sk)SA={o,t:Date.now(),e:dur+ord.length*14+80};
 document.querySelectorAll('#hd .c').forEach(e=>{const j=+e.dataset.v,k=o.findIndex((x,i)=>!u.has(i)&&x.c==ord[j]);if(k<0)return;u.add(k);const r=e.getBoundingClientRect(),dx=o[k].x-r.left,dy=o[k].y-r.top;if(Math.abs(dx)<1&&Math.abs(dy)<1)return;
  const an=e.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:`translate(${dx*.5}px,${dy*.5-AH()*.06}px) scale(1.08)`,offset:.45},{transform:'none'}],{duration:dur,delay:j*14,easing:'cubic-bezier(.3,.7,.3,1)',fill:'backwards'});if(sk)an.currentTime=sk})}

function dealFx(v,N,L){const el=Date.now()-dealAt,A=$('#app'),W=A?A.clientWidth:AW(),H=A?A.clientHeight:AH(),vh=AH()/100,vw=AW()/100,g=geo(),sl=slots(L,g),FL=380,step=2000/(RULES.hand*N),f=(S.dl+1)%N,iv=(v-f+N)%N;

 for(let j=0;j<RULES.hand;j++)for(let i=0;i<N;i++){const s=(f+i)%N,d=(j*N+i)*step-el;if(d+FL<0)continue;let tx,ty,s1,r=(j%2?1:-1)*(8+(i*7)%12);
  if(s==v&&j<L){tx=trL+g.cw*(sl.x0+j*sl.st)+g.cw/2;ty=trT+g.cw*sl.ym+g.cw*.7;s1=g.cw/(14*vh);r=0}
  else{const k=ORDER.indexOf(s);if(k<0)continue;tx=(14.1+k*19.05)/100*W+8.35*vh;ty=9.65*vh;s1=.3}
  h+=`<i class="c bk fly" style="--dx:${(tx-dcx).toFixed(1)}px;--dy:${(ty-dcy).toFixed(1)}px;--s1:${s1.toFixed(3)};--r:${r}deg;animation-delay:${d.toFixed(0)}ms"></i>`}
 return{h,d:j=>((j*N+iv)*step+FL*.9-el).toFixed(0)}}

function learnNE(){return `<h2>Learn to Play</h2>
<h3>🎯 लक्ष्य</h3><ul><li>आफ्ना सबै पत्ती मेल्ड (३ वा बढी पत्तीको समूह) मा मिलाएर पहिले <b>FIN</b> गर्ने। खेलाडी २ देखि ५ जना।</li></ul>
<h3>🃏 पत्ती र बाँडफाँड</h3><ul><li>३ सेट तास (१५६) + ३ पुतली (जोकर) = १५९ पत्ती। सबैलाई २१-२१ पत्ती बाँडिन्छ। एउटा पत्ती भुइँमा खुला राखिन्छ र एउटा <b>माल (तिप्लु)</b> लुकाइन्छ।</li></ul>
<h3>🔁 पालो</h3><ul><li>पालोमा १ पत्ती उठाउने (डेकबाट वा भुइँको माथिल्लो खुला पत्ती) र १ पत्ती फाल्ने। भुइँबाट उठाएको पत्ती त्यही पालोमा फिर्ता फाल्न मिल्दैन।</li><li>पत्ती फाल्न: कार्ड छानेर <b>SHOW</b> थिच्ने (वा तानेर टेबलमा छोड्ने)।</li><li>पुतली (जोकर) भुइँमा फाल्न मिल्दैन (हातमा अरू पत्ती भएसम्म)।</li></ul>
<h3>🧩 मेल्डका किसिम</h3><ul><li><b>शुद्ध सिक्वेन्स:</b> उही सुटका ३–५ वा बढी क्रमागत पत्ती (जस्तै ♠4-5-6)। A लाई Q-K-A वा A-2-3 मा राख्न मिल्छ; K-A-2 मिल्दैन।</li><li><b>टनेला:</b> ३ उस्तै पत्ती (उही रङ्क र उही सुट)।</li><li><b>ट्रिप्लेट:</b> फरक सुटका ३ उस्तै रङ्क (जस्तै ♦1 ♥1 ♣1) — माल हेरेपछि अन्तिम गेममा मात्र।</li><li><b>डर्टी मेल्ड:</b> वाइल्ड (जोकर/माल) लगाएर बनेको मेल्ड — माल हेरेपछि अन्तिम गेममा मात्र।</li></ul>
<h3>👁 माल हेर्ने (SEQ)</h3><ul><li>माल लुकेको हुन्छ। जोकर बिना <b>३ शुद्ध सिक्वेन्स/टनेला</b> (वा ७ डबली) बनाएपछि <b>SEQ/DUB</b> थिच्नुस्, अनि देखाउने पत्ती एकएक गरी ट्याप गरेर उचाल्नुस्, र फेरि SEQ/DUB थिच्नुस्। ती मेल्ड टेबलमा राखिन्छन्।</li><li><b>विशेष शक्ति:</b> आफ्नो पहिलो पालोमा केही नउठाई SEQ/DUB गर्नुभयो भने माल तुरुन्तै देखिन्छ।</li><li>पत्ती उठाएपछि SEQ गर्नुभयो भने एउटा पत्ती फालेपछि मात्र माल देखिन्छ।</li><li>माल हेरेको पालोमा FIN गर्न मिल्दैन; पहिले एउटा पत्ती फाल्नुपर्छ।</li><li>माल पुतली निस्कियो भने: हेर्ने खेलाडीले त्यो पुतली आफैं लिई टेबलमा देखाउँछ (५ अङ्क), अनि अर्को पत्ती नयाँ माल बन्छ।</li></ul>
<h3>⭐ वाइल्ड पत्ती (माल हेरेपछि मात्र)</h3><ul><li><b>तिप्लु</b> = मालकै पत्ती। <b>चाप्लु</b> = तिप्लुको सुटको एक रङ्क माथिको (२ अङ्क)। <b>दुप्लु</b> = एक रङ्क तलको (२ अङ्क)।</li><li><b>अल्टर</b> = उही रङ्क, उही रङ्गको अर्को सुट (५ अङ्क)। उही रङ्क, अर्को रङ्गको सुट पनि वाइल्ड हुन्छ तर अङ्क पाउँदैन।</li><li><b>पुतली (जोकर)</b> पनि वाइल्ड हो र अल्टर जत्तिकै अङ्क पाउँछ।</li><li><b>सुपरम्यान (मास्टर/गाई) कार्ड</b> (नियममा ON गरेको भए): पुतली जस्तै वाइल्ड हुन्छ र उही नियम लाग्छ, तर प्रत्येकको १० अङ्क।</li></ul>
<h3>🎴 TUNELA (सुरुमै)</h3><ul><li>पत्ती बाँडेपछि हातमा टनेला छ भने पहिलो पालोअघि <b>TUNELA</b> थिचेर देखाउन पाइन्छ। यसरी देखाएको टनेलाले ३ मेल्डमध्ये एक गनिन्छ र अङ्क पनि पाउँछ।</li></ul>
<h3>🂠 डबली</h3><ul><li>जोकर बिना ७ जोडी (उस्तै २ पत्ती) देखाएर <b>DUB</b> थिच्ने। त्यसपछि ८ औँ जोडी बनाएर FIN गर्नुपर्छ।</li><li><b>डबली ३ वा ४ जनादेखि (सेटिङमा छान्न मिल्ने) मात्र</b> खेल्न मिल्छ। टनेला देखाएपछि डबली मिल्दैन।</li></ul>
<h3>🏁 FIN</h3><ul><li>माल हेरेपछि बाँकी सबै पत्ती मेल्डमा मिल्छ भने फाल्ने पत्ती छानेर <b>FIN</b> थिच्नुस्। नमिले FIN हुँदैन। बाँकी १-२ वाइल्ड कुनै मेल्डमा नलागे मिलेको मानिँदैन।</li></ul>
<h3>🔢 अङ्क</h3><ul><li><b>तिप्लु</b>: १ वटा = ३, २ वटा = ८, ३+ = ८।</li><li><b>चाप्लु र दुप्लु</b>: २ / ५ / १० (१ / २ / ३+ वटा)। <b>अल्टर र पुतली</b>: ५ / १५ / २५ (१ / २ / ३+ वटा)।</li><li><b>मेरेज</b> (तिप्लु + चाप्लु + दुप्लु तीनै): १ जोडा = १५, २+ जोडा = ५०।</li><li><b>टनेला:</b> साधारण ५, पुतली-जस्तो अर्को रङ्गको वाइल्ड १०, चाप्लु/दुप्लु २०, अल्टर वा पुतली ३५। २ टनेला भए +५, ३+ भए +३५।</li></ul>
<h3>💰 हिसाब</h3><ul><li>हरेकले आफ्नो अङ्कलाई खेलाडी संख्याले गुणा गरी सबैको कुल अङ्क घटाउँछ। माल नदेख्नेको अङ्क ०।</li></ul>

function learnEN(){return `<h2>Learn to Play</h2>
<h3>🎯 Goal</h3><ul><li>Arrange all your cards into melds (groups of 3 or more) and press <b>FIN</b> first. 2 to 5 players.</li></ul>
<h3>🃏 Cards &amp; deal</h3><ul><li>3 decks (156) + 3 jokers (Putali) = 159 cards. Everyone gets 21. One card is placed face up on the floor and one card is hidden as the <b>maal (Tiplu)</b>.</li></ul>
<h3>🔁 Your turn</h3><ul><li>Pick 1 card (from the deck or the top open floor card), then throw 1. A card picked from the floor cannot be thrown straight back the same turn.</li><li>To throw: select a card and press <b>SHOW</b> (or drag it onto the table).</li><li>A Putali (joker) cannot be thrown on the floor while you hold other cards.</li></ul>
<h3>🧩 Kinds of melds</h3><ul><li><b>Pure sequence:</b> 3–5 or more consecutive cards of the same suit (e.g. ♠4-5-6). Ace can be Q-K-A or A-2-3; K-A-2 is not allowed.</li><li><b>Tunnela:</b> 3 identical cards (same rank and suit).</li><li><b>Triplet:</b> 3 cards of the same rank in different suits (♦1 ♥1 ♣1) — only in the final hand after seeing the maal.</li><li><b>Dirty meld:</b> a meld that uses wild cards — only in the final hand after seeing the maal.</li></ul>
<h3>👁 Seeing the maal (SEQ)</h3><ul><li>The maal is hidden. Make <b>3 pure sequences/tunnelas</b> (no joker) or 7 dublis, press <b>SEQ/DUB</b>, tap the cards to show one by one (they lift), then press SEQ/DUB again. The melds go on the table.</li><li><b>Special power:</b> if you do this on your first turn without picking anything, the maal is revealed immediately.</li><li>If you do it after picking a card, the maal is revealed only after you throw one card.</li><li>You cannot FIN in the same turn you saw the maal; throw a card first.</li><li>If the maal is a Putali: the player who looked takes it and shows it on the table (5 pts) and the next card becomes the maal.</li></ul>
<h3>⭐ Wild cards (only after seeing)</h3><ul><li><b>Tiplu</b> = the maal card itself. <b>Chaplu</b> = one rank above the maal in its suit (2 pts). <b>Duplu</b> = one rank below (2 pts).</li><li><b>Alter</b> = same rank, other suit of the same colour (5 pts). Same rank in the other colour is also wild but scores nothing.</li><li><b>Putali (joker)</b> is wild and scores like an Alter.</li><li><b>Superman (master) card</b> (if switched ON in Rules): wild and follows the same rules as the Putali, but each one scores 10.</li></ul>
<h3>🎴 TUNELA (at the start)</h3><ul><li>If your dealt hand has a tunnela, press <b>TUNELA</b> before your first turn to show it. It counts as one of the 3 melds and also scores points.</li></ul>
<h3>🂠 Dubli</h3><ul><li>Show 7 pairs (2 identical cards, no jokers) and press <b>DUB</b>; then make an 8th pair and FIN.</li><li><b>Dubli needs at least 3 or 4 players (your choice in Settings).</b> It is not allowed after showing a tunnela.</li></ul>
<h3>🏁 FIN</h3><ul><li>After seeing the maal, if all remaining cards fit into melds, select the card to throw and press <b>FIN</b>. If they do not fit, FIN is refused. 1–2 leftover wilds that fit no meld do not count as fitting.</li></ul>
<h3>🔢 Points</h3><ul><li><b>Tiplu</b>: 1 card = 3, 2 = 8, 3+ = 8.</li><li><b>Chaplu and Duplu</b>: 2 / 5 / 10 (1 / 2 / 3+ cards). <b>Alter and Putali</b>: 5 / 15 / 25 (1 / 2 / 3+ cards).</li><li><b>Marriage</b> (Tiplu + Chaplu + Duplu together): 1 set = 15, 2+ sets = 50.</li><li><b>Tunnela:</b> plain 5, other-colour wild 10, Chaplu/Duplu 20, Alter or Putali 35. Two tunnelas +5, three or more +35.</li></ul>
<h3>💰 Settlement</h3><ul><li>Everyone multiplies their points by the number of players and subtracts the total of all points. A player who did not see the maal scores 0.</li></ul>
<h3>🌐 Online</h3><ul><li>The host opens a room and sends the 6-digit code. The lobby has chat and voice (🎙); the host can mute/unmute anyone (🔇/🔊) or mute everyone at once.</li><li>If the host loses internet or leaves, another player automatically becomes the host and the game continues (takes about 15 seconds). The old host rejoins as a normal player if they come back. (Not available in Nearby mode.)</li><li>Offline for 1 minute: that hand is packed face-down and the others carry on. Latecomers wait in the lobby and join the next game automatically.</li><li><b>🧩 Rules:</b> the host can change Putali, Dubli, TUNELA, picking wild cards from the floor, Marriage bonus in the lobby (or Settings → Rules).</li></ul>`}
