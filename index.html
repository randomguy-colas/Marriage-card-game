function learnNE(){return `<h2>Learn to Play</h2>
<h3>🎯 लक्ष्य</h3><ul><li>आफ्ना सबै पत्ती मेल्ड (३ वा बढी पत्तीको समूह) मा मिलाएर पहिले <b>FIN</b> गर्ने। खेलाडी २ देखि ५ जना।</li></ul>
<h3>🃏 पत्ती र बाँडफाँड</h3><ul><li>३ सेट तास (१५६) + ३ पुतली (जोकर) = १५९ पत्ती। सबैलाई २१-२१ पत्ती बाँडिन्छ। एउटा पत्ती भुइँमा खुला राखिन्छ र एउटा <b>माल (तिप्लु)</b> लुकाइन्छ।</li></ul>
<h3>🔁 पालो</h3><ul><li>पालोमा १ पत्ती उठाउने (डेकबाट वा भुइँको माथिल्लो खुला पत्ती) र १ पत्ती फाल्ने। भुइँबाट उठाएको पत्ती त्यही पालोमा फिर्ता फाल्न मिल्दैन।</li><li>पत्ती फाल्न: कार्ड छानेर <b>SHOW</b> थिच्ने (वा तानेर टेबलमा छोड्ने)।</li><li>पुतली (जोकर) भुइँमा फाल्न मिल्दैन (हातमा अरू पत्ती भएसम्म)।</li></ul>
<h3>🧩 मेल्डका किसिम</h3><ul><li><b>शुद्ध सिक्वेन्स:</b> उही सुटका ३–५ वा बढी क्रमागत पत्ती (जस्तै ♠4-5-6)। A लाई Q-K-A वा A-2-3 मा राख्न मिल्छ; K-A-2 मिल्दैन।</li><li><b>टनेला:</b> ३ उस्तै पत्ती (उही रङ्क र उही सुट)।</li><li><b>ट्रिप्लेट:</b> फरक सुटका ३ उस्तै रङ्क (जस्तै ♦1 ♥1 ♣1) — माल हेरेपछि अन्तिम गेममा मात्र।</li><li><b>डर्टी मेल्ड:</b> वाइल्ड (जोकर/माल) लगाएर बनेको मेल्ड — माल हेरेपछि अन्तिम गेममा मात्र।</li></ul>
<h3>👁 माल हेर्ने (SEQ)</h3><ul><li>माल लुकेको हुन्छ। जोकर बिना <b>३ शुद्ध सिक्वेन्स/टनेला</b> (वा ७ डबली) बनाएपछि <b>SEQ/DUB</b> थिच्नुस्, अनि देखाउने पत्ती एकएक गरी ट्याप गरेर उचाल्नुस्, र फेरि SEQ/DUB थिच्नुस्। ती मेल्ड टेबलमा राखिन्छन्।</li><li><b>विशेष शक्ति:</b> आफ्नो पहिलो पालोमा केही नउठाई SEQ/DUB गर्नुभयो भने माल तुरुन्तै देखिन्छ।</li><li>पत्ती उठाएपछि SEQ गर्नुभयो भने एउटा पत्ती फालेपछि मात्र माल देखिन्छ।</li><li>माल हेरेको पालोमा FIN गर्न मिल्दैन; पहिले एउटा पत्ती फाल्नुपर्छ।</li><li>माल पुतली निस्कियो भने: हेर्ने खेलाडीले त्यो पुतली आफैं लिई टेबलमा देखाउँछ (५ अङ्क), अनि अर्को पत्ती नयाँ माल बन्छ।</li></ul>
<h3>⭐ वाइल्ड पत्ती (माल हेरेपछि मात्र)</h3><ul><li><b>तिप्लु</b> = मालकै पत्ती। <b>चाप्लु</b> = तिप्लुको सुटको एक रङ्क माथिको (२ अङ्क)। <b>दुप्लु</b> = एक रङ्क तलको (२ अङ्क)।</li><li><b>अल्टर</b> = उही रङ्क, उही रङ्गको अर्को सुट (५ अङ्क)। उही रङ्क, अर्को रङ्गको सुट पनि वाइल्ड हुन्छ तर अङ्क पाउँदैन।</li><li><b>पुतली (जोकर)</b> पनि वाइल्ड हो र अल्टर जत्तिकै अङ्क पाउँछ।</li></ul>
<h3>🎴 TUNELA (सुरुमै)</h3><ul><li>पत्ती बाँडेपछि हातमा टनेला छ भने पहिलो पालोअघि <b>TUNELA</b> थिचेर देखाउन पाइन्छ। यसरी देखाएको टनेलाले ३ मेल्डमध्ये एक गनिन्छ र अङ्क पनि पाउँछ।</li></ul>
<h3>🂠 डबली</h3><ul><li>जोकर बिना ७ जोडी (उस्तै २ पत्ती) देखाएर <b>DUB</b> थिच्ने। त्यसपछि ८ औँ जोडी बनाएर FIN गर्नुपर्छ।</li><li><b>डबली ३ वा ४ जनादेखि (सेटिङमा छान्न मिल्ने) मात्र</b> खेल्न मिल्छ। टनेला देखाएपछि डबली मिल्दैन।</li></ul>
<h3>🏁 FIN</h3><ul><li>माल हेरेपछि बाँकी सबै पत्ती मेल्डमा मिल्छ भने फाल्ने पत्ती छानेर <b>FIN</b> थिच्नुस्। नमिले FIN हुँदैन। बाँकी १-२ वाइल्ड कुनै मेल्डमा नलागे मिलेको मानिँदैन।</li></ul>
<h3>🔢 अङ्क</h3><ul><li><b>तिप्लु</b>: १ वटा = ३, २ वटा = ८, ३+ = ८।</li><li><b>चाप्लु र दुप्लु</b>: २ / ५ / १० (१ / २ / ३+ वटा)। <b>अल्टर र पुतली</b>: ५ / १५ / २५ (१ / २ / ३+ वटा)।</li><li><b>मेरेज</b> (तिप्लु + चाप्लु + दुप्लु तीनै): १ जोडा = १५, २+ जोडा = ५०।</li><li><b>टनेला:</b> साधारण ५, पुतली-जस्तो अर्को रङ्गको वाइल्ड १०, चाप्लु/दुप्लु २०, अल्टर वा पुतली ३५। २ टनेला भए +५, ३+ भए +३५।</li></ul>

function learnEN(){return `<h2>Learn to Play</h2>
<h3>🎯 Goal</h3><ul><li>Arrange all your cards into melds (groups of 3 or more) and press <b>FIN</b> first. 2 to 5 players.</li></ul>
<h3>🃏 Cards &amp; deal</h3><ul><li>3 decks (156) + 3 jokers (Putali) = 159 cards. Everyone gets 21. One card is placed face up on the floor and one card is hidden as the <b>maal (Tiplu)</b>.</li></ul>
<h3>🔁 Your turn</h3><ul><li>Pick 1 card (from the deck or the top open floor card), then throw 1. A card picked from the floor cannot be thrown straight back the same turn.</li><li>To throw: select a card and press <b>SHOW</b> (or drag it onto the table).</li><li>A Putali (joker) cannot be thrown on the floor while you hold other cards.</li></ul>
<h3>🧩 Kinds of melds</h3><ul><li><b>Pure sequence:</b> 3–5 or more consecutive cards of the same suit (e.g. ♠4-5-6). Ace can be Q-K-A or A-2-3; K-A-2 is not allowed.</li><li><b>Tunnela:</b> 3 identical cards (same rank and suit).</li><li><b>Triplet:</b> 3 cards of the same rank in different suits (♦1 ♥1 ♣1) — only in the final hand after seeing the maal.</li><li><b>Dirty meld:</b> a meld that uses wild cards — only in the final hand after seeing the maal.</li></ul>
<h3>👁 Seeing the maal (SEQ)</h3><ul><li>The maal is hidden. Make <b>3 pure sequences/tunnelas</b> (no joker) or 7 dublis, press <b>SEQ/DUB</b>, tap the cards to show one by one (they lift), then press SEQ/DUB again. The melds go on the table.</li><li><b>Special power:</b> if you do this on your first turn without picking anything, the maal is revealed immediately.</li><li>If you do it after picking a card, the maal is revealed only after you throw one card.</li><li>You cannot FIN in the same turn you saw the maal; throw a card first.</li><li>If the maal is a Putali: the player who looked takes it and shows it on the table (5 pts) and the next card becomes the maal.</li></ul>
<h3>⭐ Wild cards (only after seeing)</h3><ul><li><b>Tiplu</b> = the maal card itself. <b>Chaplu</b> = one rank above the maal in its suit (2 pts). <b>Duplu</b> = one rank below (2 pts).</li><li><b>Alter</b> = same rank, other suit of the same colour (5 pts). Same rank in the other colour is also wild but scores nothing.</li><li><b>Putali (joker)</b> is wild and scores like an Alter.</li></ul>
<h3>🎴 TUNELA (at the start)</h3><ul><li>If your dealt hand has a tunnela, press <b>TUNELA</b> before your first turn to show it. It counts as one of the 3 melds and also scores points.</li></ul>
<h3>🂠 Dubli</h3><ul><li>Show 7 pairs (2 identical cards, no jokers) and press <b>DUB</b>; then make an 8th pair and FIN.</li><li><b>Dubli needs at least 3 or 4 players (your choice in Settings).</b> It is not allowed after showing a tunnela.</li></ul>
<h3>🏁 FIN</h3><ul><li>After seeing the maal, if all remaining cards fit into melds, select the card to throw and press <b>FIN</b>. If they do not fit, FIN is refused. 1–2 leftover wilds that fit no meld do not count as fitting.</li></ul>
<h3>🔢 Points</h3><ul><li><b>Tiplu</b>: 1 card = 3, 2 = 8, 3+ = 8.</li><li><b>Chaplu and Duplu</b>: 2 / 5 / 10 (1 / 2 / 3+ cards). <b>Alter and Putali</b>: 5 / 15 / 25 (1 / 2 / 3+ cards).</li><li><b>Marriage</b> (Tiplu + Chaplu + Duplu together): 1 set = 15, 2+ sets = 50.</li><li><b>Tunnela:</b> plain 5, other-colour wild 10, Chaplu/Duplu 20, Alter or Putali 35. Two tunnelas +5, three or more +35.</li></ul>
<h3>💰 Settlement</h3><ul><li>Everyone multiplies their points by the number of players and subtracts the total of all points. A player who did not see the maal scores 0.</li></ul>
<h3>🌐 Online</h3><ul><li>The host opens a room and sends the 6-digit code. The lobby has chat and voice (🎙); the host can mute/unmute anyone (🔇/🔊) or mute everyone at once.</li><li>Offline for 1 minute: that hand is packed face-down and the others carry on. Latecomers wait in the lobby and join the next game automatically.</li><li><b>🧩 Rules:</b> the host can change Putali, Dubli, TUNELA, picking wild cards from the floor, Marriage bonus in the lobby (or Settings → Rules).</li></ul>`}
